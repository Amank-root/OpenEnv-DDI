[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m ddi.server.app
server = "ddi.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["ddi", "ddi.server", "ddi.task_cases"]
package-dir = { "ddi" = ".", "ddi.server" = "server", "ddi.task_cases" = "task_cases" }

[tool.uv.workspace]
members = [
    "demo",
    ".",
]

[tool.uv.sources]
openenv-ddi = { workspace = true }
